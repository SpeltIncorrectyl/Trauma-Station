- type: entity
  parent: BaseRewardRoleSpawner
  id: RewardRoleSpawnerBodyguard
  name: bodyguard tablet
  description: A small tablet confirming your hire of a bodyguard. Activate it to register.
  components:
  - type: RoleHireSpawner
    objectives:
    - RewardRoleBodyguardTargetSurvive
  - type: ComponentToggler
    components:
    - type: GhostRole
      name: ghost-role-information-reward-bodyguard-name
      description: ghost-role-information-reward-bodyguard-description
      rules: ghost-role-information-nonantagonist-rules
      mindRoles:
      - MindRoleGhostRoleNeutral
      raffle:
        settings: default
    - type: GhostRoleMobSpawner
      prototype: RewardRoleBodyguard

- type: entity
  parent: BaseReinforcement
  id: RewardRoleBodyguard
  name: ghostrole reward bodyguard
  categories: [ HideSpawnMenu ]
  components:
  - type: Loadout
    prototypes: [RewardRoleBodyguardGear]
    roleLoadout: [RewardRoleBodyguardLoadout]

- type: entity
  parent: BaseKeepAliveObjective
  id: RewardRoleBodyguardTargetSurvive
  name: Make sure your boss survives.
  description: That's your job, isn't it?
  components:
  - type: TargetObjective
    title: objective-condition-bodyguard-protect-title
  - type: PickBoss
  - type: Objective
    difficulty: 1
    icon:
      sprite: Objects/Weapons/Melee/baseball_bat.rsi
      state: icon

- type: startingGear
  id: RewardRoleBodyguardGear
  equipment:
    id: PassengerPDA
    ears: ClothingHeadsetGrey
    back: ClothingBackpack
    jumpsuit: ClothingUniformJumpsuitColorGrey
    shoes: ClothingShoesColorBlack
    eyes: ClothingEyesGlassesCheapSunglasses
    head: ClothingHeadHatGreyFlatcap

- type: roleLoadout
  id: RewardRoleBodyguardLoadout
  groups:
  - GroupSpeciesBreathTool
  - Survival
  - RewardRoleBodyguardLoadoutGroupWeapon

- type: loadoutGroup
  id: RewardRoleBodyguardLoadoutGroupWeapon
  name: loadout-group-reward-role-bodyguard-weapon
  hidden: true
  loadouts:
  - RewardRoleBodyguardLoadoutWeaponBaseBallBat

- type: loadout
  id: RewardRoleBodyguardLoadoutWeaponBaseBallBat
  storage:
    back:
    - BaseBallBat
