- type: entity
  id: AutoVendorFood
  parent: BaseAutoVendor
  name: Food AutoVendor
  components:
  - type: Store
    name: store-preset-name-food-vendor
    categories:
    - AutoVendorFood
  - type: AutomatedVendor
    slots:
    - containerId: random-food-products
      whitelist:
        components:
        - Edible
  - type: Sprite
    sprite: Structures/Machines/VendingMachines/snack.rsi
    layers:
    - state: "off"
      map: ["enum.VendingMachineVisualLayers.Base"]
    - state: "normal-unshaded"
      map: ["enum.VendingMachineVisualLayers.BaseUnshaded"]
      shader: unshaded
  - type: ContainerContainer
    containers:
      random-food-products: !type:Container

- type: storeCategory
  id: AutoVendorFood
  name: store-category-auto-vendor-food
  priority: 0

- type: listing
  id: AutoVendorRandomFoodProduct
  name: Random Station-Made Food
  description: Purchase a tasty food product placed in here earlier by the station's talented chefs.
  productEvent: !type:DispenseFromContainerEvent
    containerId: random-food-products
  icon:
    sprite: Objects/Consumable/Food/burger.rsi
    state: cheese
  cost:
    NanoCash: 100
  categories:
  - AutoVendorFood
  restockTime: 0
  conditions:
  - !type:ContainerNotEmptyCondition
    containerId: random-food-products
